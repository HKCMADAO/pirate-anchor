<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#06121f"><meta name="description" content="Pirate Anchor: hold to hook, let go to fly. Twenty hand-built voyages through the deep.">
<title>Pirate Anchor</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06121f;color:#e8fff9;font-family:"Trebuchet MS","Segoe UI",sans-serif;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button{font:inherit;cursor:pointer;color:inherit;border:0;touch-action:manipulation}
button:focus-visible,canvas:focus-visible{outline:2px solid #ffd166;outline-offset:3px}
[hidden]{display:none!important}
#game{position:relative;width:100%;height:100%;height:100dvh;overflow:hidden;isolation:isolate}
canvas{position:absolute;inset:0;width:100%;height:100%;outline:none}
.eyebrow{font-size:10px;letter-spacing:3px;font-weight:600;color:#9ac6c6}

#hud{position:absolute;left:max(18px,env(safe-area-inset-left));right:max(16px,env(safe-area-inset-right));top:max(16px,env(safe-area-inset-top));display:flex;align-items:flex-start;gap:14px;pointer-events:none;text-shadow:0 2px 8px #020a12}
.hud-left{flex:1;min-width:0}
#hud-name{font-size:17px;font-weight:700;letter-spacing:1px;margin:3px 0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-row{display:flex;align-items:center;gap:7px;font:13px Consolas,monospace}
.sep{width:1px;height:12px;background:#9ac6c640}
#hud-nails b{font-size:15px;color:#b4e8d9;margin-right:2px;transition:.3s}#hud-nails b.lost{color:#ff6b4a33;transform:scale(.7)}
.coin-ico{color:#ffd166;font-size:10px}#hud-glass{color:#ffd166}
#hud-doubloons{display:flex;gap:4px}#hud-doubloons i{width:12px;height:12px;border-radius:50%;border:1.5px solid #ffd16688;display:block}#hud-doubloons i.got{background:#ffd166;box-shadow:0 0 8px #ffd166}
.hud-right{text-align:right;padding-top:1px}
#hud-time{font:300 30px Consolas,monospace;line-height:1;font-variant-numeric:tabular-nums}
#hud-time.over{color:#ff9a76}
.round-button{flex-shrink:0;pointer-events:auto;width:46px;height:46px;border:1px solid #78ffe63f;border-radius:50%;background:#b4fff00c;display:grid;place-items:center;backdrop-filter:blur(8px)}
.round-button svg{fill:none;stroke:#cfefe6;stroke-width:2;stroke-linecap:round}.round-button:active{background:#b4fff025}

#combo{position:absolute;left:0;right:0;top:22%;text-align:center;pointer-events:none;font:900 54px "Trebuchet MS",sans-serif;color:#eafff8;text-shadow:0 0 24px #4fffe0aa,0 4px 0 #0a2a33;opacity:0;transform:scale(.6)}
#combo.pop{animation:pop .7s ease-out}
#combo small{display:block;font-size:13px;letter-spacing:5px;color:#9ef7e4;margin-top:-4px}
@keyframes pop{0%{opacity:0;transform:scale(1.8) rotate(-6deg)}15%{opacity:1;transform:scale(1) rotate(0)}70%{opacity:1}100%{opacity:0;transform:scale(.92)}}

#tip{position:absolute;bottom:max(13%,calc(env(safe-area-inset-bottom) + 60px));left:8%;right:8%;text-align:center;pointer-events:none;display:grid;gap:8px;transition:opacity .4s;text-shadow:0 2px 10px #06121f}
#tip strong{font-size:17px;letter-spacing:2px;font-weight:600}
#tip.faded{opacity:0}
#gesture{font-size:30px;color:#95edda;animation:press 1.4s ease-in-out infinite}
@keyframes press{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(6px) scale(.88)}}

.screen{position:absolute;inset:0;overflow-y:auto;padding:max(26px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(26px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));background:radial-gradient(ellipse at 50% 0%,#174a52cc,#061520f2 60%);backdrop-filter:blur(6px);touch-action:pan-y;z-index:4}
.menu-head{text-align:center;margin-bottom:18px}
.panel-anchor{color:#6cf6cf;font-size:34px;filter:drop-shadow(0 0 12px #4fffe088)}
h1{font-size:30px;letter-spacing:6px;margin:8px 0 6px;font-weight:800;background:linear-gradient(#fff6d6,#ffd166);-webkit-background-clip:text;background-clip:text;color:transparent}
.lede{margin:0;color:#9ec7c2;letter-spacing:2px;font-size:13px}
.menu-stats{margin-top:12px;font:14px Consolas,monospace;color:#ffd166}
.chapter{max-width:420px;margin:0 auto 16px}
.chapter h3{font-size:11px;letter-spacing:3px;color:#9ac6c6;margin:0 0 8px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.lvl{aspect-ratio:1;border-radius:14px;background:linear-gradient(160deg,#1d5054,#0c2a33);border:1px solid #78ffe63a;box-shadow:inset 0 1px 0 #d3fff025,0 3px 0 #04161d;display:grid;place-items:center;align-content:center;gap:2px;position:relative}
.lvl b{font:700 21px Consolas,monospace}
.lvl small{font-size:10px;letter-spacing:1px;color:#ffd166;min-height:12px}
.lvl:active{transform:translateY(2px)}
.lvl[disabled]{opacity:.35;cursor:default;background:#0c222a}
.lvl.done{border-color:#ffd16677}
.lvl.next{border-color:#4fffe0;box-shadow:0 0 0 2px #4fffe055,0 3px 0 #04161d;animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 4px #4fffe033,0 0 18px #4fffe055}}
.settings{display:flex;justify-content:center;gap:18px;margin-top:14px}
.settings button{background:none;font-size:12px;letter-spacing:1px;color:#96c7bc;padding:8px;min-height:36px}
.settings button[aria-pressed=false]{color:#70918c}

#overlay{position:absolute;inset:0;background:#020c18aa;backdrop-filter:blur(8px);display:grid;place-items:center;padding:20px;z-index:5}
.glass-panel{width:min(100%,350px);border:1px solid #78ffe644;border-radius:24px;background:linear-gradient(145deg,#174041f0,#081e2af7);box-shadow:0 25px 90px #0008,inset 0 1px 0 #d3fff025;padding:24px 24px 18px;text-align:center;animation:surface .3s ease-out}
#panel-kicker{font:9px Consolas,monospace;letter-spacing:4px;color:#95c5bd}
h2{font-size:26px;font-weight:800;letter-spacing:3px;margin:10px 0 12px}
#stars{display:flex;justify-content:center;gap:10px;margin:0 0 6px}
#stars span{font-size:40px;color:#ffffff1c;transform:scale(.4);transition:none}
#stars span.on{color:#ffd166;text-shadow:0 0 18px #ffd166aa;animation:star .45s cubic-bezier(.2,1.8,.4,1) forwards}
#stars span:nth-child(2){font-size:50px;margin-top:-8px}
@keyframes star{from{transform:scale(2.4) rotate(-30deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
#final-score{font:300 46px Consolas,monospace;line-height:1.1}
.result-caption{font-size:9px;color:#96bcb6;letter-spacing:3px;margin-top:4px}
#new-best{font-size:11px;color:#ffd166;letter-spacing:1px;margin:8px 0 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 10px;padding:14px 0;border-top:1px solid #8ce3cb22;border-bottom:1px solid #8ce3cb22}
.stats div{display:grid;gap:4px}.stats span{font-size:9px;letter-spacing:2px;color:#98bdb4}.stats b{font:18px Consolas,monospace;font-weight:400}
.star-goals{display:grid;gap:3px;font-size:11px;color:#ffffff55;margin-bottom:6px}.star-goals .met{color:#ffd166}
#panel-copy{font-size:12px;color:#9ebfbf;letter-spacing:1px;margin:10px 0 18px}
.primary,.secondary{width:100%;min-height:48px;letter-spacing:2px;font-size:14px;border-radius:12px;font-weight:700}
.primary{background:#a6f5d8;color:#103b3a;box-shadow:inset 0 1px 0 #fff9,0 3px 0 #36796c}
.secondary{margin-top:10px;background:#9deddb0a;border:1px solid #99edda33;color:#b5e1d6;font-size:12px;font-weight:600}
.primary:active,.secondary:active{transform:translateY(2px)}
@keyframes surface{from{opacity:0;transform:translateY(25px) scale(.96)}to{opacity:1;transform:none}}
@media(min-aspect-ratio:3/4){#game{max-width:560px;margin:auto;box-shadow:0 0 120px #1a625333}body{background:radial-gradient(ellipse at center,#102d3c,#030c15)}}
@media(max-height:620px){#hud-name{font-size:14px;margin:2px 0 4px}#hud-time{font-size:24px}.glass-panel{padding:16px 20px 12px}h2{margin:6px 0 8px;font-size:22px}#stars span{font-size:30px}#stars span:nth-child(2){font-size:38px}.stats{margin:10px 0 6px;padding:10px 0;gap:8px}.primary,.secondary{min-height:42px}}
</style>
</head>
<body>
<main id="game" aria-label="Pirate Anchor">
  <canvas id="sea" aria-label="Hold to hook the nearest anchor, let go to fly. Space key also works." tabindex="0"></canvas>
  <header id="hud" hidden>
    <div class="hud-left"><div class="eyebrow" id="hud-level">LEVEL 1</div><div id="hud-name">First Hook</div>
      <div class="hud-row"><span id="hud-nails" aria-label="Hull"><b>✦</b><b>✦</b><b>✦</b></span><span class="sep"></span><span class="coin-ico">◆</span><span id="hud-glass">0</span><span class="sep"></span><span id="hud-doubloons" aria-label="Doubloons"><i></i><i></i><i></i></span></div></div>
    <div class="hud-right"><div id="hud-time">0.0</div><div class="eyebrow" id="hud-par">PAR 16s</div></div>
    <button id="pause" class="round-button" aria-label="Pause"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg></button>
  </header>
  <div id="combo" aria-hidden="true"></div>
  <div id="tip" aria-live="polite"><div id="gesture">☝</div><strong id="tip-text">Hold to throw the anchor</strong></div>

  <section id="menu" class="screen" aria-labelledby="menu-title">
    <div class="menu-head"><div class="panel-anchor" aria-hidden="true">⚓</div><h1 id="menu-title">PIRATE ANCHOR</h1><p class="lede">Hold to hook. Let go to fly.</p>
      <div class="menu-stats"><span id="menu-stars">0 / 60 ★</span></div></div>
    <div id="chapters"></div>
    <div class="settings"><button id="sound" aria-pressed="true">Sound: On</button><button id="haptics" aria-pressed="true">Haptics: On</button></div>
  </section>

  <div id="overlay" hidden>
    <section class="glass-panel" role="dialog" aria-modal="true" aria-labelledby="panel-title">
      <div class="eyebrow" id="panel-kicker">CAPTAIN'S LOG</div><h2 id="panel-title">Paused</h2>
      <div id="stars" hidden aria-label="Stars"><span>★</span><span>★</span><span>★</span></div>
      <div id="results" hidden>
        <div id="final-score">0</div><div class="result-caption">SCORE</div><div id="new-best" hidden>New best!</div>
        <div class="stats">
          <div><span>TIME</span><b id="r-time">0.0s</b></div><div><span>DOUBLOONS</span><b id="r-coins">0/3</b></div>
          <div><span>SEA GLASS</span><b id="r-glass">0</b></div><div><span>BEST COMBO</span><b id="r-combo">0</b></div>
        </div>
        <div class="star-goals"><span id="g1">★ Reach the treasure</span><span id="g2">★ All 3 doubloons</span><span id="g3">★ Under par</span></div>
      </div>
      <p id="panel-copy">The tide can wait, captain.</p>
      <button id="primary" class="primary">Continue</button>
      <button id="secondary" class="secondary">Retry</button>
      <button id="tertiary" class="secondary">Levels</button>
    </section>
  </div>
</main>
